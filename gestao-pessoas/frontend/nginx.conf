server {
    listen 5178;
    root /usr/share/nginx/html;
    index index.html;

    # Assets com hash no nome (Vite) → cache forte e imutável.
    location /gestao-pessoas/assets/ {
        alias /usr/share/nginx/html/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /gestao-pessoas/ {
        alias /usr/share/nginx/html/;
        # index.html nunca é cacheado → após deploy o navegador pega o bundle novo.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit e user-scalable: o avaliador responde no celular, e
         bloquear o zoom é o tipo de "cuidado" que atrapalha quem enxerga mal. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#006838" />
    <!-- PT Sans é a fonte da plataforma (hub, Workspace, Inventário, Fiscal).
         Sem ela o módulo cai no system-ui e destoa dos outros no mesmo Hub. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
    <title>Gestão de Pessoas · Capul</title>
  </head>
  <body class="bg-slate-50">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

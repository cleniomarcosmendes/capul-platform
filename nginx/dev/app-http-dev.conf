# ⚠️ DEV ONLY — listener HTTP :8085 pro APP (Expo Go): entregador + contagem.
#
# Por quê: em DEV o cert é self-signed e o Android REJEITA TLS self-signed
# (o app falha com "verifique a conexão"). O Expo Go aceita HTTP — este
# listener expõe SÓ as rotas que o app usa (auth + logistica + inventário),
# sem TLS.
#
# ⚠️ O inventário NÃO é liberado por prefixo (`/api/v1/`): esse prefixo é a
# raiz do FastAPI inteiro e arrastaria junto o `/api/v1/import/*`, que hoje
# não tem auth. Aqui só entram as rotas que o app realmente chama.
#
# Este arquivo NÃO é carregado pelo compose base: só entra via
# docker-compose.override.yml (gitignored, máquina de DEV), que o monta em
# /etc/nginx/conf.d/zz-app-dev.conf e publica a porta 8085.
# Em HOM/PROD nunca existe — lá o app usa HTTPS com cert válido.

server {
    listen 8085;
    server_name _;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Login/refresh do app (device-session). Mesmo rate-limit do listener 443.
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://auth_gateway;
    }

    # API da logística (minhas viagens, baixa multipart com foto).
    location /api/v1/logistica/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://logistica_backend;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        client_max_body_size 20M;
    }

    # Inventário — contagem offline no app (`src/api/inventario.ts`,
    # `src/offline/contagemOffline.ts`). O módulo serve direto sob /api/v1,
    # sem prefixo próprio, então cada família de rota vai explícita.
    #
    #   GET    /counting-lists/me                    minhas listas
    #   POST   /counting-lists/{id}/checkout         retirar (lease)
    #   DELETE /counting-lists/{id}/checkout         devolver
    #   GET    /counting-lists/{id}/products         baixar itens
    location /api/v1/counting-lists/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://inventario_backend;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    #   POST /inventory/items/{id}/count             sincronizar contagem
    location /api/v1/inventory/items/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://inventario_backend;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Qualquer outra rota não existe neste listener.
    location / {
        return 404;
    }
}

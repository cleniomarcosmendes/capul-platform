upstream hub {
    server hub:5170;
}

upstream auth_gateway {
    server auth-gateway:3000;
}

upstream gestao_ti_frontend {
    server gestao-ti-frontend:5173;
}

upstream gestao_ti_backend {
    server gestao-ti-backend:3001;
}

upstream inventario_backend {
    server inventario-backend:8000;
}

upstream inventario_frontend {
    server inventario-frontend:5174;
}

upstream configurador_frontend {
    server configurador:5175;
}

upstream fiscal_backend {
    server fiscal-backend:3002;
}

upstream fiscal_frontend {
    server fiscal-frontend:5176;
}

upstream logistica_backend {
    server logistica-backend:3003;
}

upstream logistica_frontend {
    server logistica-frontend:5177;
}

# ============================================================================
# Rate limiting zones (Plataforma Capul — protecao contra brute force/DDoS)
# ----------------------------------------------------------------------------
# auth_limit: 5 req/s por IP com burst de 10 — protege /auth/login e mudanca
#             de senha contra brute force (10 tentativas/seg por IP = muito
#             alem do que um humano faz, mas suficiente para UX normal).
# api_limit:  30 req/s por IP com burst de 50 — protege endpoints em geral
#             contra scraping agressivo sem impactar navegacao normal do usuario.
# conn_limit: maximo de 20 conexoes simultaneas por IP — previne exhaustion.
# ============================================================================
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Resposta amigavel ao exceder limite
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name platform.capul.com.br localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name platform.capul.com.br localhost;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP Stapling — reduz latência TLS e aumenta privacidade do cliente
    # (cliente não precisa consultar CA diretamente)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
    resolver_timeout 5s;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    # X-XSS-Protection removido — header obsoleto, ignorado por navegadores modernos
    # (Chromium/Firefox descontinuaram em 2019). CSP cobre o caso de uso. Auditoria 25/04 #14.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=()" always;
    # Auditoria 10/05/2026 #M7 — `preload` adicionado ao HSTS para permitir
    # submissão ao hstspreload.org (DECISÃO PENDENTE com Clenio antes de submeter).
    # ATENÇÃO: submissão a hstspreload.org é IRREVERSÍVEL por ~1 ano. Antes de
    # submeter, confirmar que TODOS os subdomínios de platform.capul.com.br
    # usam HTTPS. Adicionar `preload` ao header é só pré-requisito (não submete).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Auditoria 25/04/2026 #12 — `'unsafe-inline'` removido de `style-src`.
    # Auditoria 10/05/2026 #M6 — `block-all-mixed-content` e `upgrade-insecure-requests`
    # adicionadas ao CSP (defesa em profundidade contra mixed content em prod).
    # Vite extrai CSS para arquivo separado; sem `<style>` inline no HTML compilado.
    # `element.style.X = ...` em JS NÃO requer `unsafe-inline` (controle CSP só
    # afeta HTML/style attribute inicial).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; block-all-mixed-content; upgrade-insecure-requests;" always;

    # Ocultar versao do servidor
    server_tokens off;

    # Compressao gzip — auditoria 10/05/2026 #A2 (Performance)
    # Reducao tipica ~70% em JSON/HTML/CSS/JS. Imagens (jpg/png/woff2) ja sao
    # comprimidas, nao incluidas. min_length 1024 evita overhead em payloads
    # muito pequenos (header gzip + checksum supera o ganho).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml;

    client_max_body_size 50M;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Limite de conexoes simultaneas por IP (aplicado globalmente neste server)
    limit_conn conn_limit 20;

    # ========================================================================
    # Modo manutencao — usado durante deploy/atualizacao da plataforma
    # ------------------------------------------------------------------------
    # Ativar:    docker exec capul-nginx touch /etc/nginx/maintenance.flag
    # Desativar: docker exec capul-nginx rm   /etc/nginx/maintenance.flag
    #
    # `if (-f)` e avaliado a cada request — criar/remover o flag tem efeito
    # imediato, sem `nginx -s reload`. Uso SEGURO de `if` (server context,
    # apenas `return`) — nao cai no anti-pattern "if is evil".
    #
    # Com o flag presente, TODA rota (frontend e API) retorna 503 + pagina
    # amigavel. Elimina os 502 Bad Gateway que apareceriam enquanto os
    # backends reiniciam no rebuild.
    # ========================================================================
    if (-f /etc/nginx/maintenance.flag) {
        return 503;
    }
    error_page 503 @maintenance;
    location @maintenance {
        internal;
        default_type text/html;
        # Pagina estatica de manutencao: CSP relaxada so aqui (precisa de
        # <style> inline; sem JS, sem dado sensivel). add_header em location
        # nao herda os do server — esta resposta sai so com estes headers.
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'" always;
        add_header Retry-After 600 always;
        add_header Cache-Control "no-store" always;
        return 503 '<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plataforma Capul — Em manutencao</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background:#0f172a; color:#e2e8f0; }
  .card { text-align:center; padding:48px 40px; max-width:520px; }
  .bar { width:48px; height:4px; border-radius:2px; background:#22c55e; margin:0 auto 28px; }
  h1 { font-size:26px; margin:0 0 14px; color:#f8fafc; font-weight:600; }
  p { font-size:15px; line-height:1.65; color:#94a3b8; margin:8px 0; }
  .badge { display:inline-block; margin-top:28px; padding:9px 18px; background:#1e293b;
           border:1px solid #334155; border-radius:8px; font-size:13px; color:#cbd5e1; }
</style>
</head>
<body>
<div class="card">
  <div class="bar"></div>
  <h1>Plataforma em manutencao</h1>
  <p>Estamos aplicando uma atualizacao para melhorar o sistema.</p>
  <p>A plataforma volta a funcionar em poucos minutos.</p>
  <div class="badge">Atualize esta pagina em instantes</div>
</div>
</body>
</html>';
    }

    # =======================================
    # Auth Gateway API
    # =======================================
    # Rate limit RIGOROSO para endpoints de autenticacao (brute force protection).
    # 5 req/s burst 10, com "nodelay" (rejeita imediatamente ao exceder em vez
    # de enfileirar — melhor para brute force).
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://auth_gateway;
    }

    location /api/v1/core/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://auth_gateway;
    }

    # Rotas internas bloqueadas para acesso externo
    location /api/v1/internal/ {
        deny all;
        return 403;
    }

    # =======================================
    # Gestao de T.I.
    # =======================================
    location /gestao-ti/ {
        proxy_pass http://gestao_ti_frontend/;
    }

    location /api/v1/gestao-ti/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://gestao_ti_backend;
    }

    # =======================================
    # Configurador
    # =======================================
    location /configurador/ {
        proxy_pass http://configurador_frontend/;
    }

    # =======================================
    # Inventario (FastAPI backend + React frontend)
    # =======================================
    location /inventario/ {
        proxy_pass http://inventario_frontend/;
    }

    location /api/v1/inventory/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://inventario_backend/api/v1/inventory/;
    }

    location /api/v1/inventories/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://inventario_backend/api/v1/inventories/;
    }

    location /api/v1/import-produtos {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://inventario_backend/api/v1/import-produtos;
        proxy_read_timeout 1800s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
    }

    location /api/v1/sync/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://inventario_backend/api/v1/sync/;
        proxy_read_timeout 300s;
    }

    location /api/v1/integration/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://inventario_backend/api/v1/integration/;
    }

    location /api/v1/import/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://inventario_backend/api/v1/import/;
    }

    location /api/v1/products/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://inventario_backend/api/v1/products/;
    }

    location /api/v1/warehouses/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://inventario_backend/api/v1/warehouses/;
    }

    location /api/v1/assignments/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://inventario_backend/api/v1/assignments/;
    }

    location /api/v1/cycles/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://inventario_backend/api/v1/cycles/;
    }

    location /api/v1/lot-draft/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://inventario_backend/api/v1/lot-draft/;
    }

    location /api/v1/validation/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://inventario_backend/api/v1/validation/;
    }

    location /api/v1/monitoring/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://inventario_backend/api/v1/monitoring/;
    }

    location /api/v1/discrepancies/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://inventario_backend/api/v1/discrepancies/;
    }

    location = /api/v1/discrepancies {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://inventario_backend/api/v1/discrepancies;
    }

    location /api/v1/my-closed-rounds-simple {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://inventario_backend/api/v1/my-closed-rounds-simple;
    }

    location /api/v1/counting-lists/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://inventario_backend/api/v1/counting-lists/;
    }

    location /api/v1/counting/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://inventario_backend/api/v1/counting/;
    }

    location /api/v1/dashboard/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://inventario_backend/api/v1/dashboard/;
    }

    location /api/v1/reports/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://inventario_backend/api/v1/reports/;
    }

    # =======================================
    # Modulo Fiscal
    # =======================================
    location /fiscal/ {
        proxy_pass http://fiscal_frontend/fiscal/;
    }

    location /api/v1/fiscal/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://fiscal_backend;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        client_max_body_size 20M;
    }

    # =======================================
    # Logística (Entregas/Frota)
    # =======================================
    location /entregas/ {
        proxy_pass http://logistica_frontend/entregas/;
    }

    location /api/v1/logistica/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://logistica_backend;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        client_max_body_size 20M;
    }

    # =======================================
    # Hub (rota padrao — ultima)
    # =======================================
    location / {
        proxy_pass http://hub;
    }
}

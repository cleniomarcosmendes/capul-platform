# Rotação de logs aplicada a todos os serviços — auditoria 26/04/2026 #1
# (Observabilidade). Sem isso, /var/lib/docker/containers/*/-json.log cresce
# indefinidamente até encher o disco. Com 50m × 5 arquivos: ~250MB max por
# container, ~3.25GB total para os 13 serviços.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"
    compress: "true"

services:
  # =======================================
  # REVERSE PROXY
  # =======================================
  nginx:
    image: nginx:alpine
    container_name: capul-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - hub
      - auth-gateway
      - configurador
      - gestao-ti-frontend
      - inventario-frontend
      - fiscal-frontend
    restart: unless-stopped
    logging: *default-logging
    # Limites de recursos — auditoria 25/04/2026 #5 (proxy reverso, todo tráfego passa)
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.5
    # Healthcheck — auditoria 25/04/2026 #6
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://127.0.0.1/api/v1/auth/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # =======================================
  # INFRAESTRUTURA
  # =======================================
  postgres:
    image: postgres:16-alpine
    container_name: capul-db
    # Auditoria 10/05/2026 #M1 Performance — pg_stat_statements habilitado
    # para visibilidade de slow queries (top-N por tempo total/médio).
    # CREATE EXTENSION pg_stat_statements precisa rodar uma vez (depois do
    # primeiro startup com shared_preload_libraries definido).
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.max=10000
      -c pg_stat_statements.track=all
      -c pg_stat_statements.save=on
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER obrigatorio no .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD obrigatorio no .env}
      POSTGRES_DB: capul_platform
    # Porta NAO exposta externamente — acesso apenas via rede Docker interna
    # Para acesso local de manutencao: docker compose exec postgres psql -U ${DB_USER} capul_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init-schemas.sql:/docker-entrypoint-initdb.d/01-schemas.sql
      - ./inventario/database:/migrations-inv:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging
    # Limites de recursos — auditoria 25/04/2026 #5 (DB pode crescer com queries pesadas)
    mem_limit: 2g
    mem_reservation: 256m
    cpus: 1.0

  # Banco DEDICADO da base RFB (Receita Dados Abertos) — separado do capul-db
  # por desempenho de consulta e liberdade total de SQL (decisão 02/06; descartado
  # MinhaReceita). Representa a "máquina exclusiva" da RFB: em HOM/PROD real,
  # RFB_DATABASE_URL aponta pra máquina dedicada do Douglas. Dados copiados do
  # schema `rfb` do capul-db (versão 2026-05).
  postgres-rfb:
    image: postgres:16-alpine
    container_name: capul-db-rfb
    environment:
      # Credenciais dedicadas da RFB. Se RFB_DB_USER/RFB_DB_PASSWORD não forem
      # definidos no .env, caem para DB_USER/DB_PASSWORD (comportamento legado).
      # Numa máquina dedicada provisionada do zero, definir RFB_DB_* cria a role
      # já no primeiro boot. ATENÇÃO: estas vars só valem na 1ª inicialização do
      # volume; em banco já criado, ajustar a role via SQL (CREATE/ALTER ROLE).
      POSTGRES_USER: ${RFB_DB_USER:-${DB_USER:?DB_USER obrigatorio no .env}}
      POSTGRES_PASSWORD: ${RFB_DB_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD obrigatorio no .env}}
      POSTGRES_DB: capul_rfb
    # Porta NAO exposta externamente — acesso apenas via rede Docker interna.
    # (Em DEV, docker-compose.override.yml publica 5433 p/ HOM/PROD consumirem.)
    volumes:
      - postgres_rfb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RFB_DB_USER:-${DB_USER}}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging
    # RFB tem GIN trgm sobre ~71M linhas — um pouco mais de RAM que o capul-db.
    mem_limit: 3g
    mem_reservation: 512m
    cpus: 1.5

  # ============================================================
  # COFRE de comprovante de entrega (Logística Fase 1b)
  # ------------------------------------------------------------
  # Banco Postgres ISOLADO — espelha o conceito do postgres-rfb, mas com uma
  # diferença CRÍTICA: o RFB é reimportável (backup opcional); o cofre é
  # INSUBSTITUÍVEL (a prova lastreia a cobrança a prazo) → backup OBRIGATÓRIO
  # + retenção 5 anos. Guarda só METADADOS da prova; os binários (foto/
  # assinatura) ficam no object store `minio`. Em PROD vira máquina dedicada
  # provisionada pela infra (Douglas/Marco); aqui em DEV é container local.
  # ============================================================
  postgres-cofre:
    image: postgres:16-alpine
    container_name: capul-db-cofre
    environment:
      POSTGRES_USER: ${COFRE_DB_USER:-${DB_USER:?DB_USER obrigatorio no .env}}
      POSTGRES_PASSWORD: ${COFRE_DB_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD obrigatorio no .env}}
      POSTGRES_DB: ${COFRE_DB_NAME:-capul_cofre}
    # Porta NAO exposta externamente — acesso só pela rede Docker interna.
    # (Em DEV, docker-compose.override.yml publica 5434 p/ rodar migrations.)
    volumes:
      - postgres_cofre_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${COFRE_DB_USER:-${DB_USER}}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    mem_reservation: 128m

  # Object store S3-compatível p/ os binários da prova (foto/assinatura).
  # Isolado do banco — incha não o Postgres, e em PROD pode virar S3/MinIO real.
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: capul-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-${DB_USER:?DB_USER obrigatorio no .env}}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD obrigatorio no .env}}
    # Portas NAO expostas externamente — só rede Docker interna.
    # (Em DEV, docker-compose.override.yml publica 9000/9001 p/ console+API.)
    volumes:
      - minio_cofre_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    mem_reservation: 128m

  redis:
    image: redis:7-alpine
    container_name: capul-redis
    # Se REDIS_PASSWORD estiver ausente/vazio, o Compose aborta com erro
    # (sintaxe ${VAR:?}). Evita repetir o incidente 19/04/2026 onde Redis
    # subiu sem autenticacao porque a var nao estava preenchida em prod.
    # Auditoria 10/05/2026 #M2 (Performance) — maxmemory + LRU eviction
    # Container tem mem_limit 256m; deixamos 200mb pro Redis + 56mb headroom pro
    # overhead (RDB snapshots temporarios, fragmentacao). Sem maxmemory, Redis
    # daria OOM antes de evictar (default policy=noeviction).
    # allkeys-lru: evicta a chave menos recentemente usada (cache real, nao crítico).
    command: redis-server --requirepass ${REDIS_PASSWORD:?Variavel REDIS_PASSWORD obrigatoria no .env — sem isto Redis rodaria sem autenticacao} --maxmemory 200mb --maxmemory-policy allkeys-lru
    # Porta NAO exposta externamente — acesso apenas via rede Docker interna
    volumes:
      - redis_data:/data
    restart: unless-stopped
    logging: *default-logging
    # Limites de recursos — auditoria 25/04/2026 #5
    mem_limit: 256m
    mem_reservation: 32m
    cpus: 0.25
    # Healthcheck — auditoria 25/04/2026 #6
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # =======================================
  # CORE — Auth Gateway + Portal Hub
  # =======================================
  # Init job — aplica migrations Prisma antes do auth-gateway subir.
  # Padronizacao 05/05/2026 (incidente deploy 04/05 — gestao-ti subiu com 5 migrations
  # pendentes porque Dockerfile/CMD ia direto pra `node dist/main.js`). Roda 1x, sai
  # com exit 0/1 e o backend so inicia se este sair com sucesso (service_completed_successfully).
  auth-migrate:
    build: ./auth-gateway
    container_name: capul-auth-migrate
    command: ["sh", "-c", "npx prisma migrate deploy"]
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/capul_platform?schema=core&connection_limit=10
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  auth-gateway:
    build: ./auth-gateway
    container_name: capul-auth
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/capul_platform?schema=core&connection_limit=10
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET obrigatorio no .env (64+ chars — gerar com openssl rand -hex 64)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET obrigatorio (deve ser diferente de JWT_SECRET)}
      # Auditoria 10/05/2026 #B1 — secret separado p/ MFA token (princípio menor privilégio)
      JWT_MFA_SECRET: ${JWT_MFA_SECRET:?JWT_MFA_SECRET obrigatorio no .env (gerar com openssl rand -hex 64; deve ser DIFERENTE de JWT_SECRET)}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-60m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      # App entregador (Logística Fase 1b): access mobile curto + sessão deslizante.
      JWT_MOBILE_EXPIRATION: ${JWT_MOBILE_EXPIRATION:-15m}
      JWT_MOBILE_REFRESH_EXPIRATION: ${JWT_MOBILE_REFRESH_EXPIRATION:-30d}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NODE_ENV: production
      # Auditoria 10/05/2026 #B3 — CORS_ORIGINS obrigatório (fallback localhost removido)
      CORS_ORIGINS: "${CORS_ORIGINS:?CORS_ORIGINS obrigatoria no .env (lista separada por virgula, ex.: https://platform.capul.com.br,https://localhost)}"
      # SMTP — usado pelo AlertNotifierService e EmailService (envio transacional
      # centralizado /api/v1/internal/email/send, consumido por Gestão TI/Fiscal).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-plataforma@capul.com.br}
      # Opt-in p/ aceitar certificado TLS quando hostname não bate com CN/SAN
      # (ex.: smtp.capul.com.br aponta pra inbox1.vertip.net). Default seguro: true.
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
    # Porta NAO exposta — acesso via Nginx reverse proxy
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      auth-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *default-logging
    # Limites de recursos — auditoria 25/04/2026 #5 (NestJS + Prisma + bcrypt)
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 0.5
    # Healthcheck — auditoria 25/04/2026 #6
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/auth/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  hub:
    build: ./hub
    container_name: capul-hub
    # Porta NAO exposta — acesso via Nginx reverse proxy
    depends_on:
      - auth-gateway
    restart: unless-stopped
    logging: *default-logging
    # Limites de recursos — auditoria 25/04/2026 #5 (frontend nginx static)
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.25
    # Healthcheck — auditoria 25/04/2026 #6
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5170/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  configurador:
    build: ./configurador
    container_name: capul-configurador
    # Porta NAO exposta — acesso via Nginx reverse proxy
    depends_on:
      - auth-gateway
    restart: unless-stopped
    logging: *default-logging
    # Limites de recursos — auditoria 25/04/2026 #5 (frontend nginx static)
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.25
    # Healthcheck — auditoria 25/04/2026 #6
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5175/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # =======================================
  # MODULO — Inventario
  # =======================================
  inventario-backend:
    build: ./inventario/backend
    container_name: capul-inventario-api
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/capul_platform
      JWT_SECRET: ${JWT_SECRET}
      DB_SCHEMA: inventario
      CORE_SCHEMA: core
      UNIFIED_AUTH: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CORS_ORIGINS: "https://platform.capul.com.br,https://localhost,https://172.16.0.159"
      ENVIRONMENT: production
      DEBUG: "false"
      PROTHEUS_API_URL: ${PROTHEUS_API_URL:-https://apiportal.capul.com.br:8104/rest/api/INFOCLIENTES/hierarquiaMercadologica}
      PROTHEUS_API_AUTH: ${PROTHEUS_API_AUTH:-Basic QVBJQ0FQVUw6QXAxQzRwdTFQUkQ=}
      PROTHEUS_API_TIMEOUT: ${PROTHEUS_API_TIMEOUT:-30}
      PROTHEUS_INVENTARIO_URL: ${PROTHEUS_INVENTARIO_URL:-https://apiportal.capul.com.br:8104/rest/api/INFOCLIENTES}
      PROTHEUS_INVENTARIO_AUTH: ${PROTHEUS_INVENTARIO_AUTH:-Basic QVBJQ0FQVUw6QXAxQzRwdTFQUkQ=}
      PROTHEUS_INVENTARIO_TIMEOUT: ${PROTHEUS_INVENTARIO_TIMEOUT:-60}
      PROTHEUS_INVENTARIO_VERIFY_SSL: ${PROTHEUS_INVENTARIO_VERIFY_SSL:-false}
    # Porta NAO exposta — acesso via Nginx reverse proxy
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging
    # Limites de recursos — auditoria 25/04/2026 #5 (FastAPI + sync Protheus)
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 0.5

  inventario-frontend:
    build: ./inventario/frontend
    container_name: capul-inventario-web
    # Porta NAO exposta — acesso via Nginx reverse proxy
    depends_on:
      - inventario-backend
    restart: unless-stopped
    logging: *default-logging
    # Limites de recursos — auditoria 25/04/2026 #5 (frontend nginx static)
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.25
    # Healthcheck — auditoria 25/04/2026 #6
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5174/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # =======================================
  # MODULO — Gestao de T.I.
  # =======================================
  # Init job — ver comentario em auth-migrate. Mesma logica para gestao-ti.
  gestao-ti-migrate:
    build: ./gestao-ti/backend
    container_name: capul-gestao-ti-migrate
    command: ["sh", "-c", "npx prisma migrate deploy"]
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/capul_platform?schema=public&connection_limit=10
      DB_SCHEMA: gestao_ti
      CORE_SCHEMA: core
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  gestao-ti-backend:
    build: ./gestao-ti/backend
    container_name: capul-gestao-ti-api
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/capul_platform?schema=public&connection_limit=10
      JWT_SECRET: ${JWT_SECRET}
      DB_SCHEMA: gestao_ti
      CORE_SCHEMA: core
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NODE_ENV: production
      # Auditoria 10/05/2026 #B3 — CORS_ORIGINS obrigatório (fallback localhost removido)
      CORS_ORIGINS: "${CORS_ORIGINS:?CORS_ORIGINS obrigatoria no .env (lista separada por virgula)}"
      # Integração Compras → Fiscal (14/05/2026) — vincular chave NF-e no
      # cadastro de NF de Compras. URL interna container-to-container.
      FISCAL_API_URL: http://fiscal-backend:3002/api/v1/fiscal
    # Porta NAO exposta — acesso via Nginx reverse proxy
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      gestao-ti-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *default-logging
    # Limites de recursos — auditoria 25/04/2026 #5 (NestJS + Prisma + uploads)
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 0.5
    # Healthcheck — auditoria 25/04/2026 #6
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/v1/gestao-ti/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  gestao-ti-frontend:
    build: ./gestao-ti/frontend
    container_name: capul-gestao-ti-web
    # Porta NAO exposta — acesso via Nginx reverse proxy
    depends_on:
      - gestao-ti-backend
    restart: unless-stopped
    logging: *default-logging
    # Limites de recursos — auditoria 25/04/2026 #5 (frontend nginx static)
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.25
    # Healthcheck — auditoria 25/04/2026 #6
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # =======================================
  # MODULO — Fiscal
  # =======================================
  # Init job — ver comentario em auth-migrate. Mesma logica para fiscal.
  fiscal-migrate:
    build: ./fiscal/backend
    container_name: capul-fiscal-migrate
    command: ["sh", "-c", "npx prisma migrate deploy"]
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/capul_platform?schema=public&connection_limit=10
      DB_SCHEMA: fiscal
      CORE_SCHEMA: core
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  fiscal-backend:
    build: ./fiscal/backend
    container_name: capul-fiscal-api
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/capul_platform?schema=public&connection_limit=10
      # Base RFB em banco DEDICADO. Host/porta/banco/credenciais via .env:
      #   default = container local `postgres-rfb` (capul-db-rfb), creds = DB_USER/DB_PASSWORD.
      #   p/ apontar a uma máquina externa (ex.: máquina de DEV que já tem os
      #   41 GB carregados, ou a máquina exclusiva do Douglas), definir
      #   RFB_DB_HOST / RFB_DB_PORT / RFB_DB_NAME + RFB_DB_USER / RFB_DB_PASSWORD
      #   no .env — credenciais próprias (role read-only), desacopladas do banco
      #   operacional. Se RFB_DB_USER/RFB_DB_PASSWORD vazios, usa DB_USER/DB_PASSWORD.
      RFB_DATABASE_URL: postgresql://${RFB_DB_USER:-${DB_USER}}:${RFB_DB_PASSWORD:-${DB_PASSWORD}}@${RFB_DB_HOST:-postgres-rfb}:${RFB_DB_PORT:-5432}/${RFB_DB_NAME:-capul_rfb}?schema=rfb&connection_limit=10
      JWT_SECRET: ${JWT_SECRET}
      DB_SCHEMA: fiscal
      CORE_SCHEMA: core
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NODE_ENV: production
      PORT: 3002
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}
      FISCAL_NFE_CERT_PATH: ${FISCAL_NFE_CERT_PATH:-/app/certs/certificado-fiscal.pfx}
      # Variaveis OBRIGATORIAS — Compose aborta se ausentes/vazias.
      # Evita repetir o incidente 19/04/2026 (subir com vars vazias e rodar
      # em modo degradado silencioso sem erro aparente).
      FISCAL_MASTER_KEY: ${FISCAL_MASTER_KEY:?FISCAL_MASTER_KEY obrigatoria no .env (senha do certificado A1 depende dela)}
      FISCAL_SEFAZ_AMBIENTE: ${FISCAL_SEFAZ_AMBIENTE:-HOMOLOGACAO}
      FISCAL_PAUSE_SYNC: ${FISCAL_PAUSE_SYNC:-false}
      FISCAL_CNPJ_CONSULENTE: ${FISCAL_CNPJ_CONSULENTE:?FISCAL_CNPJ_CONSULENTE obrigatoria (CNPJ consulente SEFAZ)}
      PROTHEUS_API_URL: ${PROTHEUS_API_URL:?PROTHEUS_API_URL obrigatoria no .env (consultas cadastrais dependem dela)}
      PROTHEUS_API_AUTH: ${PROTHEUS_API_AUTH:?PROTHEUS_API_AUTH obrigatoria no .env (sem isto Fiscal nao autentica no Protheus)}
      # Auditoria 10/05/2026 #B4 — default mudou de true para false. Quem precisar
      # de mock em DEV local define FISCAL_PROTHEUS_MOCK=true no .env explicitamente.
      # Default seguro evita PROD subir em modo mock por esquecimento.
      FISCAL_PROTHEUS_MOCK: ${FISCAL_PROTHEUS_MOCK:-false}
      # NOTA 05/05/2026: env var FISCAL_CTE_DISTRIBUICAO_ENABLED removida —
      # controle migrado pra fiscal.ambiente_config.cte_distribuicao_ativo
      # (UI: /operacao/controle/cte-distribuicao, role ADMIN_TI).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-fiscal@capul.com.br}
      FISCAL_FALLBACK_EMAIL: ${FISCAL_FALLBACK_EMAIL:-ti@capul.com.br}
      FISCAL_STORAGE: /app/xmls
    # Porta NAO exposta — acesso via Nginx reverse proxy
    volumes:
      - ./fiscal/backend/certs:/app/certs
      - fiscal_xmls:/app/xmls
    depends_on:
      postgres:
        condition: service_healthy
      # RFB: dependência leve (service_started, não healthy) — o boot do fiscal
      # é resiliente à RFB indisponível (PrismaRfbService reconecta lazy). Quando
      # RFB_DB_HOST aponta p/ máquina externa, o container local postgres-rfb
      # pode nem rodar; por isso não bloqueamos por health dele.
      postgres-rfb:
        condition: service_started
        required: false
      redis:
        condition: service_started
      fiscal-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *default-logging
    # Limites de recursos — auditoria 25/04/2026 #5 (NestJS + BullMQ + parsers XML)
    mem_limit: 768m
    mem_reservation: 128m
    cpus: 0.75

  fiscal-frontend:
    build: ./fiscal/frontend
    container_name: capul-fiscal-web
    # Porta NAO exposta — acesso via Nginx reverse proxy
    depends_on:
      - fiscal-backend
    restart: unless-stopped
    logging: *default-logging
    # Limites de recursos — auditoria 25/04/2026 #5 (frontend nginx static)
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.25
    # Healthcheck — auditoria 25/04/2026 #6
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5176/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # =======================================
  # FERRAMENTAS
  # =======================================
  pgadmin:
    image: dpage/pgadmin4
    container_name: capul-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:5050:80"  # Apenas acesso local (localhost do servidor)
    depends_on:
      - postgres
    logging: *default-logging
    # Limites de recursos — auditoria 25/04/2026 #5 (uso intermitente administrativo)
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.25
    # Healthcheck — auditoria 25/04/2026 #6 (pgAdmin expõe /misc/ping)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/misc/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # =======================================
  # MAILHOG — SMTP de captura para DEV
  # =======================================
  # Só sobe com profile `mail`: `docker compose --profile mail up -d mailhog`.
  # Em HOM/PROD o profile não é usado e este serviço fica fora do compose.
  # UI: http://localhost:8025 — SMTP: mailhog:1025 (rede docker interna).
  mailhog:
    image: mailhog/mailhog
    container_name: capul-mailhog
    profiles: ["mail"]
    ports:
      - "127.0.0.1:8025:8025"  # UI web só localhost
    logging: *default-logging
    restart: unless-stopped

  # ============================================================
  # Módulo Logística (Entregas/Frota) — Fase 1a (scaffold).
  # Schema próprio `logistica` (additivo, isolado). Porta 3003.
  # ============================================================
  logistica-migrate:
    build: ./logistica/backend
    container_name: capul-logistica-migrate
    command: ["sh", "-c", "npx prisma migrate deploy"]
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/capul_platform?schema=public&connection_limit=10
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  # Migra o COFRE (banco isolado) — schema próprio prisma/cofre/schema.prisma.
  logistica-cofre-migrate:
    build: ./logistica/backend
    container_name: capul-logistica-cofre-migrate
    command: ["sh", "-c", "npx prisma migrate deploy --schema=prisma/cofre/schema.prisma"]
    environment:
      COFRE_DATABASE_URL: postgresql://${COFRE_DB_USER:-${DB_USER}}:${COFRE_DB_PASSWORD:-${DB_PASSWORD}}@postgres-cofre:5432/${COFRE_DB_NAME:-capul_cofre}?schema=cofre&connection_limit=5
    depends_on:
      postgres-cofre:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  logistica-backend:
    build: ./logistica/backend
    container_name: capul-logistica-api
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/capul_platform?schema=public&connection_limit=10
      # Cofre de comprovante (banco isolado + object store). Se indisponível no
      # boot, o backend NÃO cai — o cofre é degradável (reconexão lazy).
      COFRE_DATABASE_URL: postgresql://${COFRE_DB_USER:-${DB_USER}}:${COFRE_DB_PASSWORD:-${DB_PASSWORD}}@postgres-cofre:5432/${COFRE_DB_NAME:-capul_cofre}?schema=cofre&connection_limit=10
      COFRE_S3_ENDPOINT: ${COFRE_S3_ENDPOINT:-http://minio:9000}
      COFRE_S3_BUCKET: ${COFRE_S3_BUCKET:-comprovantes}
      COFRE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-${DB_USER}}
      COFRE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-${DB_PASSWORD}}
      JWT_SECRET: ${JWT_SECRET}
      # Sugestão de rota por distância de RUA — OPT-IN. Vazio = haversine (linha
      # reta). Para ligar: suba o profile `osrm` e defina OSRM_URL=http://osrm:5000.
      OSRM_URL: ${OSRM_URL:-}
      OSRM_TIMEOUT_MS: ${OSRM_TIMEOUT_MS:-8000}
      NODE_ENV: production
      PORT: 3003
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      logistica-migrate:
        condition: service_completed_successfully
      logistica-cofre-migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  logistica-frontend:
    build: ./logistica/frontend
    container_name: capul-logistica-web
    depends_on:
      - logistica-backend
    restart: unless-stopped
    logging: *default-logging

  # ──────────────────────────────────────────────────────────────────────────
  # OSRM — distância REAL de rua p/ a sugestão de ordem (Logística Fase 1c pt2).
  # OPT-IN: não sobe no `up` padrão (tem profile). Antes de ligar, rodar UMA vez
  # o `osrm-prep` (baixa o extract OSM + processa ~minutos). Depois:
  #   docker compose --profile osrm up -d osrm
  # e no .env: OSRM_URL=http://osrm:5000
  # Região default = Minas Gerais (Geofabrik). Trocar via OSRM_REGION/OSRM_PBF_URL.
  # ──────────────────────────────────────────────────────────────────────────
  osrm-prep:
    image: osrm/osrm-backend:v5.27.1
    container_name: capul-osrm-prep
    profiles: ["osrm-prep"]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        cd /data
        REGION="${OSRM_REGION:-minas-gerais}"
        if [ -f "$$REGION.osrm.mldgr" ]; then echo ">> $$REGION ja processado — nada a fazer."; exit 0; fi
        command -v wget >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq wget)
        if [ ! -f "$$REGION.osm.pbf" ]; then
          echo ">> baixando extract OSM ($$REGION)..."
          wget -O "$$REGION.osm.pbf" "${OSRM_PBF_URL:-https://download.geofabrik.de/south-america/brazil/minas-gerais-latest.osm.pbf}"
        fi
        echo ">> osrm-extract..."   && osrm-extract -p /opt/car.lua "$$REGION.osm.pbf"
        echo ">> osrm-partition..." && osrm-partition "$$REGION.osrm"
        echo ">> osrm-customize..." && osrm-customize "$$REGION.osrm"
        echo ">> PRONTO: $$REGION.osrm (suba o serviço osrm)."
    volumes:
      - osrm_data:/data
    logging: *default-logging

  osrm:
    image: osrm/osrm-backend:v5.27.1
    container_name: capul-osrm
    profiles: ["osrm"]
    command: ["osrm-routed", "--algorithm", "mld", "/data/${OSRM_REGION:-minas-gerais}.osrm"]
    volumes:
      - osrm_data:/data
    # Porta 5000 só interna (logistica-backend chama http://osrm:5000). Em DEV,
    # o override pode publicar pra debug.
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres_data:
  postgres_rfb_data:
  postgres_cofre_data:
  minio_cofre_data:
  redis_data:
  uploads_data:
  fiscal_xmls:
  osrm_data:
